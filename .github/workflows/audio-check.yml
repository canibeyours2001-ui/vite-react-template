name: Validate Hono audio integration
on:
  pull_request:
  push:
    branches:
      - feature/mvsep-live-qwen-voice-clone
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.worker.json
      - run: npm run build
