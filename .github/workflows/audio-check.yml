name: Validate and bundle Hono MVSEP integration
on:
  pull_request:
  push:
    branches:
      - fix/pyvt-preflight-telemetry
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 tools/test_vox_longform.py
      - run: npx tsc --noEmit -p tsconfig.worker.json
      - run: npm run build
      - name: Preserve compiled Worker for safe direct Cloudflare deployment
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/pyvt-preflight-telemetry')
        run: |
          cp dist/vite_react_template/index.js /tmp/pyvt-worker-bundle.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin fix/pyvt-preflight-telemetry
            git checkout -B fix/pyvt-preflight-telemetry origin/fix/pyvt-preflight-telemetry
            mkdir -p deploy
            cp /tmp/pyvt-worker-bundle.mjs deploy/worker-bundle.mjs
            git add -f deploy/worker-bundle.mjs
            if git diff --cached --quiet; then
              echo "Worker bundle unchanged"
              break
            fi
            git commit -m "Build pyVideoTrans Worker bundle [skip ci]"
            if git push origin HEAD:refs/heads/fix/pyvt-preflight-telemetry; then
              echo "Published compiled bundle"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Could not push compiled bundle after 3 attempts"
              exit 1
            fi
          done
